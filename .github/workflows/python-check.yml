name: Python Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py run_bot.py run_bot_atomic.py run_bot_cas.py run_bot_recovery.py bot_discord_recovery.py bot_incident_ux.py bot_dispatch_board_ux.py bot_request_ux.py bot_rescue_log_ux.py bot_command_ux.py incident_transitions.py dashboard_core.py dashboard.py dashboard_performance.py dashboard_service_rankings.py dashboard_history.py dashboard_theme.py dashboard_streamline.py dashboard_streamline_phase2.py dashboard_filter_panels.py dashboard_incident_detail.py dashboard_live_refresh.py dashboard_route_bindings.py dashboard_settings_status.py dashboard_incident_card_persistence.py dashboard_incident_actions.py dashboard_discord_consistency.py dashboard_health.py dashboard_config_repair.py dashboard_operations_center.py dashboard_health_nav.py dashboard_error_pages.py dashboard_extensions.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
